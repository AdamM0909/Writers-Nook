# One-click deploy: https://render.com/deploy?repo=<your GitHub repo URL>
# Posts live in a SQLite file, so the service needs a persistent disk
# (which requires a paid Render plan). Without a disk, posts vanish on every deploy.
services:
  - type: web
    name: writers-nook
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_CODE
        sync: false   # you'll be asked for this when you set up the Blueprint
    disk:
      name: nook-data
      mountPath: /data
      sizeGB: 1
