# Free setup: the app runs on Render's free web service and keeps all posts in a free
# Turso database (Render's free tier has no disk, so nothing is stored on the server).
# The free service sleeps after ~15 min of no visitors; the next visit takes about a minute to wake it.
services:
  - type: web
    name: writers-nook
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # you'll be asked for these three when you set up the Blueprint
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
